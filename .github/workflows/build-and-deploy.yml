name: Build and push the image

on:
  push:
    branches:
      - 'main'

env:
  IMAGE_REPOSITORY_NAME: brezyweather
  IMAGE_TAG: 1.0.0

jobs:
  build:
    name: Build BrezyWeather container image
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build BrezyWeather container image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: ${{ env.IMAGE_REPOSITORY_NAME }}:${{ env.IMAGE_TAG }}

      - name: Log into Azure Container Registry
        id: acr-login
        continue-on-error: true
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.ACR_SERVER }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Explain skipped ACR push
        if: ${{ steps.acr-login.outcome != 'success' }}
        run: echo "::warning::Skipping ACR push because ACR login was not successful. Verify the ACR_SERVER, ACR_USERNAME, and ACR_PASSWORD secrets before publishing images."

      - name: Push BrezyWeather container image
        if: ${{ steps.acr-login.outcome == 'success' }}
        run: |
          docker tag "${IMAGE_REPOSITORY_NAME}:${IMAGE_TAG}" "${{ secrets.ACR_SERVER }}/${IMAGE_REPOSITORY_NAME}:${IMAGE_TAG}"
          docker push "${{ secrets.ACR_SERVER }}/${IMAGE_REPOSITORY_NAME}:${IMAGE_TAG}"
