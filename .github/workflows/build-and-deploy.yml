name: Build and push the image

on:
  push:
    branches:
      - 'main'

env:
  IMAGE_REPOSITORY_NAME: brezyweather
  IMAGE_TAG: 1.0.0

jobs:
  build:
    name: Build BrezyWeather container image
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build BrezyWeather container image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: ${{ env.IMAGE_REPOSITORY_NAME }}:${{ env.IMAGE_TAG }}

      - name: Detect ACR configuration
        id: acr-config
        env:
          ACR_SERVER: ${{ secrets.ACR_SERVER }}
          ACR_USERNAME: ${{ secrets.ACR_USERNAME }}
          ACR_PASSWORD: ${{ secrets.ACR_PASSWORD }}
        run: |
          if [ -n "${ACR_SERVER}" ] && [ -n "${ACR_USERNAME}" ] && [ -n "${ACR_PASSWORD}" ]; then
            echo "configured=true" >> "${GITHUB_OUTPUT}"
          else
            echo "configured=false" >> "${GITHUB_OUTPUT}"
          fi

      - name: Log into Azure Container Registry
        id: acr-login
        if: ${{ steps.acr-config.outputs.configured == 'true' }}
        continue-on-error: true
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.ACR_SERVER }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Explain skipped ACR push because registry configuration is missing
        if: ${{ steps.acr-config.outputs.configured != 'true' }}
        run: echo "::warning::Skipping ACR push because ACR_SERVER, ACR_USERNAME, or ACR_PASSWORD is not configured."

      - name: Explain skipped ACR push because login failed
        if: ${{ steps.acr-config.outputs.configured == 'true' && steps.acr-login.outcome != 'success' }}
        run: echo "::warning::Skipping ACR push because ACR login was not successful. Verify the configured registry credentials before publishing images."

      - name: Push BrezyWeather container image
        if: ${{ steps.acr-login.outcome == 'success' }}
        env:
          ACR_SERVER: ${{ secrets.ACR_SERVER }}
        run: |
          docker tag "${IMAGE_REPOSITORY_NAME}:${IMAGE_TAG}" "${ACR_SERVER}/${IMAGE_REPOSITORY_NAME}:${IMAGE_TAG}"
          docker push "${ACR_SERVER}/${IMAGE_REPOSITORY_NAME}:${IMAGE_TAG}"
